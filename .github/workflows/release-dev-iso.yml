name: Release dev ISO

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: JappeOS-Build branch, tag, or commit to build
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: release-dev-iso
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and release ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          repository: JappeOS/JappeOS-Build
          ref: ${{ inputs.build_ref }}
          path: JappeOS-Build

      - name: Build ISO
        working-directory: JappeOS-Build
        run: |
          set -euo pipefail
          chmod +x ./build.sh

          # build.sh already runs Docker. The script wrapper provides a TTY for
          # its current "docker run -it" invocation on GitHub-hosted runners.
          script -q -e -c './build.sh' /dev/null

      - name: Package split ISO release assets
        id: iso
        working-directory: JappeOS-Build
        run: |
          set -euo pipefail
          mapfile -t isos < <(find out -maxdepth 1 -type f -name '*.iso' -printf '%T@ %p\n' | sort -nr | awk '{print $2}')

          if [[ "${#isos[@]}" -eq 0 ]]; then
            echo "No ISO files found in JappeOS-Build/out" >&2
            exit 1
          fi

          iso_path="${isos[0]}"
          iso_name="$(basename "$iso_path")"

          if [[ ! "$iso_name" =~ ^JappeOS-([0-9]{4}\.[0-9]{2}\.[0-9]{2})-.+\.iso$ ]]; then
            echo "ISO name does not match expected format: $iso_name" >&2
            exit 1
          fi

          release_tag="dev-${BASH_REMATCH[1]}"
          artifact_dir="$RUNNER_TEMP/jappeos-release"
          mkdir -p "$artifact_dir"

          cp "$iso_path" "$artifact_dir/$iso_name"
          (
            cd "$artifact_dir"
            sha256sum "$iso_name" > "$iso_name.sha256"
            split -b 1900M "$iso_name" "$iso_name.part-"
            rm "$iso_name"

            cat > assemble-jappeos-iso.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          shopt -s nullglob
          parts=(*.iso.part-*)
          checksums=(*.iso.sha256)

          if (( ${#parts[@]} == 0 )); then
            echo "No ISO part files found. Download all *.iso.part-* files first." >&2
            exit 1
          fi

          if (( ${#checksums[@]} != 1 )); then
            echo "Expected exactly one *.iso.sha256 file, found ${#checksums[@]}." >&2
            exit 1
          fi

          checksum_file="${checksums[0]}"
          iso_name="$(awk '{print $2}' "$checksum_file")"

          if [[ -z "$iso_name" || "$iso_name" == */* ]]; then
            echo "Checksum file does not contain a valid ISO filename." >&2
            exit 1
          fi

          printf '%s\n' "${parts[@]}" | sort | xargs cat > "$iso_name"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "$checksum_file"
          elif command -v shasum >/dev/null 2>&1; then
            expected="$(awk '{print $1}' "$checksum_file")"
            actual="$(shasum -a 256 "$iso_name" | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "$iso_name: FAILED" >&2
              exit 1
            fi
            echo "$iso_name: OK"
          else
            echo "No SHA-256 tool found. Install sha256sum or shasum and rerun this script." >&2
            exit 1
          fi

          echo "Created $iso_name"
          EOF

            cat > assemble-jappeos-iso.ps1 <<'EOF'
          $ErrorActionPreference = "Stop"

          $parts = Get-ChildItem -File -Filter "*.iso.part-*" | Sort-Object Name
          if ($parts.Count -eq 0) {
            throw "No ISO part files found. Download all *.iso.part-* files first."
          }

          $checksums = Get-ChildItem -File -Filter "*.iso.sha256"
          if ($checksums.Count -ne 1) {
            throw "Expected exactly one *.iso.sha256 file, found $($checksums.Count)."
          }

          $checksumLine = Get-Content -LiteralPath $checksums[0].FullName -TotalCount 1
          if ($checksumLine -notmatch '^([0-9a-fA-F]{64})\s+\*?(.+\.iso)$') {
            throw "Checksum file does not contain a valid SHA-256 entry."
          }

          $expectedHash = $Matches[1].ToLowerInvariant()
          $isoName = Split-Path -Leaf $Matches[2]

          $output = [System.IO.File]::Open($isoName, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write)
          try {
            foreach ($part in $parts) {
              $input = [System.IO.File]::OpenRead($part.FullName)
              try {
                $input.CopyTo($output)
              }
              finally {
                $input.Dispose()
              }
            }
          }
          finally {
            $output.Dispose()
          }

          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $isoName).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            Remove-Item -LiteralPath $isoName -Force
            throw "$isoName verification failed. Delete the parts and download them again."
          }

          Write-Host "${isoName}: OK"
          Write-Host "Created $isoName"
          EOF

            chmod +x assemble-jappeos-iso.sh
          )

          {
            echo "name=$iso_name"
            echo "tag=$release_tag"
            echo "artifact_dir=$artifact_dir"
            echo "part_count=$(find "$artifact_dir" -maxdepth 1 -type f -name "$iso_name.part-*" | wc -l)"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.iso.outputs.tag }}
          ISO_NAME: ${{ steps.iso.outputs.name }}
          ARTIFACT_DIR: ${{ steps.iso.outputs.artifact_dir }}
          PART_COUNT: ${{ steps.iso.outputs.part_count }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/jappeos-release-notes.md"
          cat > "$notes_file" <<EOF
          Automated JappeOS dev ISO build.

          GitHub requires each release asset to be under 2 GiB, so the ISO is split into ${PART_COUNT} parts.

          ## Download

          Download every file whose name starts with:

          \`${ISO_NAME}.part-\`

          Also download:

          - \`${ISO_NAME}.sha256\`
          - \`assemble-jappeos-iso.sh\` for Linux or macOS
          - \`assemble-jappeos-iso.ps1\` for Windows PowerShell

          ## Assemble and verify

          Linux or macOS:

          \`\`\`bash
          chmod +x assemble-jappeos-iso.sh
          ./assemble-jappeos-iso.sh
          \`\`\`

          Windows PowerShell:

          \`\`\`powershell
          .\\assemble-jappeos-iso.ps1
          \`\`\`

          The assembly scripts recreate \`${ISO_NAME}\` and verify it against \`${ISO_NAME}.sha256\`.

          Build source: \`JappeOS/JappeOS-Build@${{ inputs.build_ref }}\`
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file" \
              --prerelease
            while IFS= read -r asset_name; do
              gh release delete-asset "$RELEASE_TAG" "$asset_name" --yes
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            gh release upload "$RELEASE_TAG" "$ARTIFACT_DIR"/* --clobber
          else
            gh release create "$RELEASE_TAG" "$ARTIFACT_DIR"/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file" \
              --prerelease
          fi
